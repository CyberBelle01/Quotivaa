<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotely - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        
        <div class="left-banner">
            <div class="banner-content">
                <div class="brand-logo">
                    <img src="logo.jpg" alt="Quotely Logo">
                    <h1>Quotely</h1>
                </div>
                <blockquote class="quote-text">
                    "I will be rich till I die."
                    <span class="quote-author">— Al-Ameen</span>
                </blockquote>
            </div>
        </div>

        <div class="right-form-area">
            <div class="form-wrapper">
                <h2>Welcome back</h2>
                <p class="subtitle">Sign in to continue to your personal quote experience.</p>

                <form>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <span class="toggle-password-icon">👁</span>
                        </div>
                    </div>
                    <button type="submit" class="btn-signin">Sign In →</button>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
