<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotivaa - Sign Up</title>
    <link rel="stylesheet" href="sign-up.css">
</head>
<body>

    <div class="signup-container" id="signup-container">
        <div class="signup-header" id="signup-header">
            <div class="logo" id="logo">
                <img src="logo.png" alt="Quotivaa Logo">
            </div>
            <h2 class="title" id="title">Sign up to your account</h2>
        </div>
        <form action="generator.html">
            <div class="input-group" id="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Full Name" required>
            </div>

            <div class="input-group" id="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Username" required>
            </div>

            <div class="input-group" id="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Email" required>
            </div>

            <div class="input-group" id="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fa-regular fa-eye-slash toggle-password"></i>
                </div>
            </div>

            <div class="input-group" id="input-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="password-wrapper" id="password-wrapper">
                    <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                    <i class="fa-regular fa-eye-slash toggle-password"></i>
                </div>
            </div>
            
            <button type="submit" class="btn-signup" id="btn-signup">Sign Up</button>
            
            <p class="footer-text" id="footer-text">Already have an account? <a href="login.html">Login</a></p>
        </form>
    </div>

</body>
</html>
