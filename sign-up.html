
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Quotivaa</title>
    <link rel="stylesheet" href="sign-up.css">
</head>
<body>
    <div class="signup-container">

        <div class="left-banner">
            <div class="banner-content">
                <a href="index.html" class="brand-logo">
                    <img src="logo-white.png" alt="Quotivaa Logo">
                </a>

                <blockquote class="quote-text">
                    "The future depends on what you do today."
                    <span class="quote-author">— Mahatma Gandhi</span>
                </blockquote>
            </div>
        </div>

        <div class="right-form-area">
            <div class="form-wrapper">

                <a href="index.html" class="form-logo-link">
                    <img src="logo-white.png" alt="Quotivaa Logo" class="form-logo">
                </a>

                <h2>Create your account</h2>
                <p class="subtitle">
                    Sign up to start your personal quote experience.
                </p>

                <form id="signupForm">
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Full Name"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <p id="message" aria-live="polite"></p>

                    <button type="submit" class="btn-signup">
                        Sign Up
                    </button>

                    <p class="footer-text">
                        Already have an account?
                        <a href="login.html">Log In</a>
                    </p>
                </form>
            </div>
        </div>

    </div>

    <script src="signup.js"></script>
</body>
</html>
