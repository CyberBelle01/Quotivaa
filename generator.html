<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotivaa - Quote Generator</title>
    <link rel="stylesheet" href="generator.css">
</head>

<body>

    <main class="generator">

        <div class="generator-brand">
            <a href="index.html">
                <img src="logo.png" alt="Quotivaa Logo">
            </a>
        </div>

        <h1>Quote Generator</h1>

        <p class="welcome-text">
            Get a little inspiration whenever you need it.
        </p>

        <div class="quote-hold">
            <p class="quotes" id="quote-text"></p>
            <p class="author" id="quote-author"></p>
        </div>

        <button class="button" id="generate-btn">
            Generate Quote
        </button>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </main>

    <script src="generator.js"></script>

</body>
</html>
